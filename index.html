<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Село XXI века — Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b9d8e7;font-family:Arial,sans-serif}
  #ui{position:fixed;left:16px;top:16px;z-index:5;color:#fff;background:rgba(12,28,39,.78);
      padding:14px 16px;border:1px solid rgba(255,255,255,.2);border-radius:14px;backdrop-filter:blur(8px);max-width:310px}
  #ui h1{font-size:18px;margin:0 0 6px} #ui p{font-size:12px;line-height:1.45;margin:0;color:#d5e8ef}
  #hint{position:fixed;right:16px;bottom:14px;color:#173344;background:rgba(255,255,255,.72);
        padding:8px 11px;border-radius:10px;font-size:12px}
  button{margin-top:10px;border:0;border-radius:8px;padding:8px 11px;background:#54d6c5;color:#092b31;font-weight:bold;cursor:pointer}
  canvas{display:block;touch-action:none}
  @media(max-width:600px){
    #ui{left:8px;top:8px;right:8px;max-width:none;padding:10px 12px;border-radius:12px}
    #ui h1{font-size:15px;margin-bottom:4px}
    #ui p{font-size:10px;line-height:1.3;max-width:95%}
    #ui button{margin-top:7px;padding:7px 10px;font-size:12px}
    #hint{right:8px;bottom:8px;left:8px;text-align:center;font-size:10px;padding:7px}
  }
</style>
</head>
<body>
<div id="ui">
  <h1>СЕЛО XXI ВЕКА</h1>
  <p>Умное экологичное поселение: 15 жилых башен, центральный парк, школа, спорткомплекс, промышленная зона и собственная солнечно-ветровая электростанция.</p>
  <button id="reset">Вернуть обзор</button>
</div>
<div id="hint">Мышь: вращение/масштаб · Телефон: один палец — вращать, два — масштабировать</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d8e7);
scene.fog = new THREE.Fog(0xb9d8e7, 125, 260);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 500);
camera.position.set(112,92,128);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.target.set(0,0,0); controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=30; controls.maxDistance=220;
controls.enablePan=true;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;

scene.add(new THREE.HemisphereLight(0xeaf8ff,0x61734d,2.0));
const sun = new THREE.DirectionalLight(0xfff0d6,3.2);
sun.position.set(-55,95,45); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-115; sun.shadow.camera.right=115;
sun.shadow.camera.top=115; sun.shadow.camera.bottom=-115; scene.add(sun);

const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grass=mat(0x8ab879), road=mat(0x343e48), sidewalk=mat(0xc8d0c9), white=mat(0xf1f4ed);
const darkGlass=mat(0x244b60,.25,.45), glass=mat(0x79b9c8,.25,.25), concrete=mat(0x9ba6a6);
const green=mat(0x267a54), brightGreen=mat(0x62ad65), solar=mat(0x102f59,.25,.55);
const metal=mat(0xd9e4e6,.3,.7), orange=mat(0xf0a34a);
function box(parent,x,y,z,sx,sy,sz,material,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material); m.position.set(x,y,z);
 m.castShadow=cast; m.receiveShadow=true; parent.add(m); return m;
}
function cylinder(parent,x,y,z,r1,r2,h,material,segments=12){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 m.position.set(x,y,z); m.castShadow=true; parent.add(m); return m;
}
function tree(x,z,scale=1){
 const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
 cylinder(g,0,1.15*scale,0,.16*scale,.22*scale,2.3*scale,mat(0x72513a),8);
 const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05*scale,1),[mat(0x2f8050),mat(0x438e54),mat(0x5b9c59)][Math.floor(Math.random()*3)]);
 crown.position.set(0,2.6*scale,0); crown.castShadow=true; g.add(crown);
}
function lamp(x,z){
 cylinder(scene,x,2.1,z,.07,.07,4.2,metal,8);
 const arm=box(scene,x+.35,4.1,z,.8,.08,.08,metal); 
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),mat(0xffe6a3,0.3)); bulb.position.set(x+.7,4.0,z); scene.add(bulb);
}
function roadStrip(x,z,w,d){
 box(scene,x,.08,z,w,.16,d,road,false);
}
function solarPanel(parent,x,y,z,w=1.7,h=1.0){
 const p=box(parent,x,y,z,w,.12,h,solar);
 for(let i=0;i<3;i++) box(parent,x-w/2+(i+1)*w/4,y+.07,z,.025,.025,h*.94,metal,false);
 box(parent,x,y-.25,z,.12,.45,.12,metal);
}
function makeTower(x,z,index){
 const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
 const floors=7+(index%3), height=floors*2.15;
 box(g,0,height/2,0,8.4,height,7.2,[mat(0xe7e8df),mat(0xd7e4e4),mat(0xcbd7d8)][index%3]);
 box(g,0,height+.22,0,8.8,.45,7.6,mat(0x344d5a));
 // facade glass bands and window grid
 for(let f=0;f<floors;f++){
   const yy=1.05+f*2.15;
   // Front and rear facades: separate glazed windows with slim dark frames.
   for(let side of [-1,1]){
     for(let c=0;c<4;c++){
       const wx=-3.1+c*2.05;
       box(g,wx,yy,side*3.67,1.48,1.42,.07,darkGlass,false);
       box(g,wx,yy,side*3.715,1.30,1.22,.035,glass,false);
       box(g,wx,yy,side*3.74,.035,1.22,.025,metal,false);
       box(g,wx,yy,side*3.74,1.30,.035,.025,metal,false);
     }
     for(let c=0;c<3;c++){
       const wz=-2.35+c*2.35;
       box(g,side*4.25,yy,wz,.07,1.42,1.55,darkGlass,false);
       box(g,side*4.295,yy,wz,.035,1.22,1.34,glass,false);
     }
   }
   // Visible horizontal floor line gives the facade architectural rhythm.
   box(g,0,yy-1.0,0,8.48,.09,7.28,mat(0xb5c4c3),false);
 }
 box(g,0,.65,3.72,2.0,1.3,.12,darkGlass,false);
 box(g,0,1.35,4.15,3.4,.16,1.0,metal,false);
 box(g,0,height+.55,0,2.2,.22,1.2,green);
 // rooftop penthouse and a small planted roof strip
 box(g,0,height+1.05,-1.4,3.2,.8,2.6,mat(0x91aaa6));
 for(let i=0;i<4;i++) box(g,-3+i*2,height+.55,-2.7,.7,.18,.55,brightGreen,false);
 // planted entrance island
 const island=box(g,0,.15,5.3,5,.3,2.3,brightGreen,false);
 for(let i=0;i<3;i++) tree(x-1.5+i*1.5,z+5.3,.45);
}
function makeSchool(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,0,3.2,0,23,6.4,13,mat(0xf0e8d4));
 box(g,-4,7.2,0,10,1.6,13,mat(0x2b6174));
 box(g,6,5.2,0,8,4,13,mat(0xd6e3df));
 // broad entrance and blue glazing
 box(g,0,2.2,6.56,7,3.8,.12,darkGlass,false);
 box(g,0,6.55,0,23,.3,13,mat(0x263f4c));
 // rooftop solar array
 for(let i=0;i<5;i++) for(let j=0;j<3;j++) solarPanel(g,-8+i*3.5,6.9,-4+j*3.2,2.6,2.1);
 box(g,-15,1.6,0,2,.35,17,orange);
}
function makeSports(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,0,4,0,25,8,19,mat(0xe7ece8));
 // curved-looking roof made of layered slabs
 box(g,0,8.25,0,26,.65,20,mat(0x2c6675));
 box(g,0,4,9.58,16,5,.12,glass,false);
 // rooftop panels
 for(let i=0;i<6;i++) for(let j=0;j<3;j++) solarPanel(g,-10+i*4,8.7,-6+j*5.5,3.2,3.8);
 // sports court
 box(g,0,.16,15,24,.25,13,mat(0x3d9a75),false);
 for(let x2 of [-10,10]) box(g,x2,.3,15,.12,.05,12,white,false);
 box(g,0,.3,15,.12,.05,12,white,false);
}
function makeFactory(x,z,idx){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,0,4,0,23,8,18,[mat(0xb8c3bf),mat(0xc8c7b7)][idx%2]);
 box(g,0,8.2,0,24,.5,19,mat(0x56656a));
 for(let i=0;i<5;i++) box(g,-9+i*4.5,4,9.1,2.8,3.2,.12,glass,false);
 const stack=cylinder(g,7,12,-5,1.1,1.4,8,mat(0x687b80),12);
 cylinder(g,7,16,-5,1.5,1.5,.5,orange,12);
 // green buffer strip
 for(let i=0;i<7;i++) tree(x-13+i*4,z+12,.7);
}
function windTurbine(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 cylinder(g,0,8,0,.22,.48,16,white,12);
 const hub=new THREE.Group();hub.position.set(0,16,0);g.add(hub);
 const center=new THREE.Mesh(new THREE.SphereGeometry(.55,12,12),metal);hub.add(center);
 for(let i=0;i<3;i++){
   const blade=new THREE.Group(); blade.rotation.z=i*Math.PI*2/3;
   box(blade,0,4.2,0,.32,8.5,.16,white);
   const tip=new THREE.Mesh(new THREE.ConeGeometry(.22,1.0,8),white);tip.position.y=8.7;blade.add(tip);
   hub.add(blade);
 }
}
function makePark(){
 // park footprint in the middle
 box(scene,0,.12,0,43,.24,38,mat(0x79b875),false);
 // looping pale paths
 roadStrip(0,0,3,32); roadStrip(0,0,37,2.5);
 // pond and island
 const pond=new THREE.Mesh(new THREE.CylinderGeometry(7,7,.22,48),mat(0x55b8c5,.22,.2));
 pond.position.set(0,.28,0);pond.scale.z=.72;pond.receiveShadow=true;scene.add(pond);
 const island=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,.3,24),brightGreen);island.position.set(0,.43,0);scene.add(island);
 // flower beds / playground / benches
 for(let i=0;i<18;i++){
   const a=i*Math.PI*2/18, r=15;
   tree(Math.cos(a)*r,Math.sin(a)*r,.72);
 }
 for(let i=0;i<8;i++){
   const a=i*Math.PI/4;
   const x=Math.cos(a)*10,z=Math.sin(a)*10;
   box(scene,x,.38,z,2.2,.25,.7,mat(0x8c6245),false);
 }
 // playground
 box(scene,-13,.35,12,9,.5,7,mat(0xe8b34c),false);
 box(scene,-13,1.5,12,.35,2.3,.35,orange);
 box(scene,-13,2.7,12,4,.25,.25,orange);
}
function makeSolarFarm(){
 // fenced energy field
 box(scene,0,.08,0,34,.16,25,mat(0x8aaf78),false);
 for(let row=0;row<5;row++) for(let col=0;col<6;col++){
   const x=-13+col*5.2,z=-9+row*4.5;
   const frame=new THREE.Group();frame.position.set(x,.7,z);scene.add(frame);
   const panel=box(frame,0,.6,0,4.2,.12,2.6,solar);
   panel.rotation.x=-.25;
   for(let k=0;k<3;k++) box(frame,-1.4+k*1.4,.68,0,.035,.03,2.45,metal,false);
   cylinder(frame,0,.25,0,.09,.09,.7,metal,8);
 }
 for(let i=0;i<4;i++) windTurbine(-23+i*15,-20);
 // small substation
 box(scene,24,.8,-4,5,1.6,5,mat(0xd7dfd8));
}
function fence(x,z,w,d){
 for(let i=0;i<=Math.floor(w/2);i++) box(scene,x-w/2+i*2,.65,z-d/2,.08,1.3,.08,metal,false);
 for(let i=0;i<=Math.floor(w/2);i++) box(scene,x-w/2+i*2,.65,z+d/2,.08,1.3,.08,metal,false);
}
function makeVillage(){
 // ground and perimeter road
 box(scene,0,-.5,0,190,1,145,grass,false);
 roadStrip(0,-59,176,5);roadStrip(0,59,176,5);
 roadStrip(-88,0,5,118);roadStrip(88,0,5,118);
 // main avenues
 roadStrip(0,-29,160,5);roadStrip(0,29,160,5);
 roadStrip(-48,0,5,112);roadStrip(48,0,5,112);
 // blocks of apartment towers: 3 rows x 5 = exactly 15
 let n=0;
 const towerX=[-72,-48,-24,24,48], towerZ=[-45,0,45];
 for(let row=0;row<3;row++) for(let col=0;col<5;col++){
   makeTower(towerX[col],towerZ[row],n++);
 }
 // central park
 makePark();
 // civic buildings north-east of park
 makeSchool(50,-27);
 makeSports(50,18);
 // factories on western outskirts
 makeFactory(-76,-27,0);makeFactory(-76,18,1);
 // solar farm on eastern edge
 const solarGroup=new THREE.Group();solarGroup.position.set(0,0,0);scene.add(solarGroup);
 // make solar farm at far east, manually shift created objects via temporary group trick
 const before=scene.children.length; makeSolarFarm();
 const created=scene.children.splice(before);
 created.forEach(o=>{o.position.x+=105;scene.add(o)});
 // wind turbine groups were moved too; yes
 // small residential greenery
 for(let i=0;i<70;i++){
   const x=(Math.random()-.5)*160,z=(Math.random()-.5)*108;
   if(Math.abs(x)<25&&Math.abs(z)<22) continue;
   if(Math.abs(x)>73||Math.abs(z)>48) continue;
   tree(x,z,.35+Math.random()*.25);
 }
 // street lamps
 for(let x=-70;x<=70;x+=14){lamp(x,-31);lamp(x,31)}
 // school/sports access parking
 box(scene,50,.1,-14,30,.2,9,road,false);
 for(let i=0;i<8;i++) box(scene,38+i*3.4,.22,-14,2.7,.04,5,white,false);
 // labels as simple signboards
 function sign(x,z,text){
   const board=box(scene,x,3,z,12,2.5,.35,mat(0x183d4a));
   const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;
   const ctx=canvas.getContext('2d');ctx.fillStyle='#e9ffff';ctx.font='bold 46px Arial';ctx.textAlign='center';ctx.fillText(text,256,82);
   const tex=new THREE.CanvasTexture(canvas);const face=new THREE.Mesh(new THREE.PlaneGeometry(11.5,2.2),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
   face.position.set(x,3.05,z+.2);scene.add(face);
 }
 sign(-76,-39,'ЭКО-ПРОМЗОНА');sign(50,-39,'ШКОЛА');sign(50,30,'СПОРТКОМПЛЕКС');sign(105,2,'СОЛНЕЧНАЯ ФЕРМА');
}
makeVillage();

// subtle clouds
for(let i=0;i<9;i++){
 const cloud=new THREE.Group();cloud.position.set((Math.random()-.5)*220,45+Math.random()*18,(Math.random()-.5)*150);
 for(let j=0;j<4;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*2,10,8),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}));puff.position.set(j*3,Math.random()*1.5,Math.random()*2);cloud.add(puff)}
 scene.add(cloud);
}
document.getElementById('reset').onclick=()=>{camera.position.set(112,92,128);controls.target.set(0,0,0);controls.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
